version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      - DATABASE_URL=postgresql://waf:waf@db:5432/waf_db
      - REDIS_URL=redis://redis:6379/0    # ← Redis по имени сервиса
      - SECRET_KEY=ssss
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    expose:
      - "5000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: waf
      POSTGRES_PASSWORD: waf
      POSTGRES_DB: waf_db
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:                                    # ← Redis контейнер
    image: redis:7                          # ← Официальный образ
    ports:
      - "6379:6379"                        # ← Доступ извне (опционально)

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:80"       # ← NGINX на 80 внутри!
    depends_on:
      - app

volumes:
  db_data:
