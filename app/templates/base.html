<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WAF Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#b91c1c',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.0/dist/index.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-900 text-slate-100 min-h-screen overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800/50 backdrop-blur-md border-r border-red-700/20 flex flex-col">
            <div class="p-6 border-b border-red-700/20">
                <a href="/" class="text-2xl font-bold text-red-700 flex items-center">
                    <i class="ph ph-fire mr-2"></i>WAF Panel
                </a>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="/dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-red-700/20 transition-all group">
                    <i class="ph ph-chart-pie text-xl"></i>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="/requests" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-red-700/20 transition-all">
                    <i class="ph ph-list text-xl"></i>
                    <span>Запросы</span>
                </a>
                <a href="/settings" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-red-700/20 transition-all">
                    <i class="ph ph-gear text-xl"></i>
                    <span>Настройки</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-gray-800/50 backdrop-blur-md border-b border-red-700/20 sticky top-0 z-50 px-6 py-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-slate-100">{% block page_title %}{% endblock %}</h1>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-slate-400">{% block subtitle %}{% endblock %}</span>
                        <button class="p-2 hover:bg-red-700/20 rounded-lg transition-colors">
                            <i class="ph ph-gear text-xl"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-y-auto p-6 pb-12">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
