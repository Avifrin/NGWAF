script_tag:
  pattern: "(?i)<\\s*(script|iframe|svg|img|body|div)\\b[^>]*>"
  tag: "XSS"
  severity: 0.95

event_handlers:
  pattern: "(?i)on\\w+\\s*=\\s*(['\"`]?)[^>]*?(alert|prompt|confirm|eval)\\s*\\("
  tag: "XSS"
  severity: 0.92

event_handlers_loose:
  pattern: "(?i)on\\w+\\s*=\\s*(['\"`]?)[^>]+"
  tag: "XSS-Event"
  severity: 0.85

js_protocols:
  pattern: "(?i)(javascript:|vbscript:|data:)"
  tag: "XSS"
  severity: 0.88

dangerous_calls:
  pattern: "(?i)(alert\\s*\\(|prompt\\s*\\(|confirm\\s*\\(|eval\\s*\\()"
  tag: "XSS-DOM"
  severity: 0.8

tag_breakout:
  pattern: "(?i)\"\\s*>\\s*<|'>\\s*<"
  tag: "XSS-Breakout"
  severity: 0.9
